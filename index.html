<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RT-321 - Exposure Calculator</title>
    
    <!-- PWA META TAGS -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RT-321">
    <!-- Standard Browser Tab Icon -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<!-- Apple iOS Home Screen Icon -->
<link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            /* ANODIZED SILVER (LIGHT MODE) */
            --chassis: linear-gradient(145deg, #f4f4f5 0%, #d4d4d8 100%); 
            --surface: #e5e5e5; 
            --display-bg: #050505; 
            
            --ink: #18181b; 
            --ink-dim: #52525b;
            --display-ink: #ffffff; 
            --display-dim: #a1a1aa;
            
            /* DEDICATED COLOR CODING */
            --color-wall: #0284c7;  /* Deep Sky Cyan */
            --color-shim: #d97706;  /* Deep Amber Gold */
            --color-wall-display: #38bdf8; /* Neon Sky Cyan for OLED glass */
            --color-shim-display: #fbbf24; /* Neon Amber Gold for OLED glass */
            --display-accent: #34d399;     /* Emerald for Total Result */
            
            --accent: #d81b60; /* Dept Magenta */
            --led-green: #10b981; /* DW Active Light */
            
            --border: #a1a1aa;
            --border-display: #000000;
            
            --input-bg: #f4f4f5; 
            --input-focus-bg: #ffffff;
            
            --overlay: rgba(0, 0, 0, 0.8); 
            --radius: 3px; 
            
            /* HARD MILLED BEVELS (ZERO BLUR) */
            --bevel-out: inset 0 1px 0 rgba(255,255,255,0.8), 0 2px 0 rgba(0,0,0,0.15);
            --bevel-in: inset 0 2px 0 rgba(0,0,0,0.15), 0 1px 0 rgba(255,255,255,0.8);
            --bevel-deep: inset 0 3px 0 rgba(0,0,0,0.2), 0 1px 0 rgba(255,255,255,1);
        }

        body.dark-mode {
            /* ANODIZED GUNMETAL (DARK MODE) */
            --chassis: linear-gradient(145deg, #27272a 0%, #09090b 100%); 
            --surface: #18181b; 
            --display-bg: #000000; 
            
            --ink: #f8fafc; 
            --ink-dim: #94a3b8; 
            --display-ink: #ffffff; 
            --display-dim: #94a3b8;
            
            /* DEDICATED COLOR CODING (DARK) */
            --color-wall: #38bdf8;  /* Glowing Sky Cyan */
            --color-shim: #fbbf24;  /* Glowing Amber Gold */
            --color-wall-display: #38bdf8;
            --color-shim-display: #fbbf24;
            --display-accent: #34d399;
            
            --accent: #ff2e8c; /* Neon Magenta */
            --led-green: #22c55e; /* DW Active Light */
            
            --border: #3f3f46;
            --border-display: #000000;
            
            --input-bg: #050505;
            --input-focus-bg: #120a0e;
            
            --overlay: rgba(0, 0, 0, 0.9);
            
            /* HARD MILLED BEVELS (DARK) */
            --bevel-out: inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 0 rgba(0,0,0,1);
            --bevel-in: inset 0 2px 0 rgba(0,0,0,1), 0 1px 0 rgba(255,255,255,0.05);
            --bevel-deep: inset 0 3px 0 rgba(0,0,0,1), 0 1px 0 rgba(255,255,255,0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden; /* STRICTLY NO SCROLLING */
            background: var(--chassis);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            height: 100%;
            margin: 0 auto;
            padding: 0 16px env(safe-area-inset-bottom, 12px) 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* --- THE CLEAN OLED DISPLAY --- */
        .sticky-readout {
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            margin-right: calc(-50vw + 50%);
            background: var(--display-bg); 
            z-index: 100;
            padding: 14px 0 8px 0;
            border-bottom: 2px solid var(--border-display);
            box-shadow: 0 1px 0 rgba(255,255,255,0.1); 
            flex-shrink: 0;
        }
        
        body.dark-mode .sticky-readout { box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05); }

        .readout-content {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: 0 16px;
            position: relative;
            z-index: 2;
        }

        .readout-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .readout-label {
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px; 
            color: var(--display-ink);
        }

        .log-btn {
            background: transparent; 
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 0.65rem; font-weight: 800;
            padding: 3px 8px; border-radius: var(--radius);
            cursor: pointer; letter-spacing: 1px;
            transition: all 0.1s;
        }
        .log-btn:active { background: var(--accent); color: var(--display-bg); }

        /* SVG TIME DISPLAY CONTAINER */
        .svg-time-container {
            width: 100%;
            height: 60px;
            margin: 2px 0;
            display: flex;
            align-items: center;
        }

        .svg-time-container svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .svg-time-text {
            font-family: "SF Mono", "Menlo", monospace;
            font-size: 52px;
            font-weight: 300;
            fill: var(--accent);
            letter-spacing: -1px;
            transition: fill 0.15s ease, filter 0.15s ease;
        }

        .svg-time-text.pulse {
            fill: #ffffff;
            filter: drop-shadow(0 0 10px var(--accent));
        }

        /* --- TELEMETRY DISPLAY STRIP --- */
        .telemetry-strip {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-top: 4px;
            border-top: 1px solid #222222; 
            padding-top: 6px;
        }

        .telemetry-item {
            font-family: "SF Mono", monospace;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--display-dim);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .telemetry-item .calc-wall {
            color: var(--color-wall-display);
            font-weight: 700;
        }

        .telemetry-item .calc-shim {
            color: var(--color-shim-display);
            font-weight: 700;
        }

        .telemetry-item .calc-math {
            color: var(--display-dim);
            font-weight: 600;
            margin: 0 2px;
        }

        .telemetry-item .calc-highlight {
            color: var(--display-accent);
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .telemetry-item .calc-unit {
            color: var(--display-ink);
            font-size: 0.68rem;
            font-weight: 800;
            margin-left: 4px;
        }

        /* --- NAVIGATION --- */
        nav { 
            display: flex; gap: 8px; margin: 8px 0; flex-shrink: 0;
        }
        
        .nav-item {
            flex: 1;
            position: relative;
            background: var(--surface); 
            border: 1px solid var(--border); 
            padding: 9px 0;
            font-size: 0.65rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--ink-dim); cursor: pointer;
            border-radius: var(--radius);
            box-shadow: var(--bevel-out);
            text-align: center;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: transparent;
            border-radius: 2px;
            transition: background 0.2s;
        }
        
        .nav-item.active { 
            background: var(--input-bg);
            color: var(--ink);
            border-color: var(--border);
            box-shadow: var(--bevel-deep);
        }

        .nav-item.active::before { background: var(--accent); }

        /* --- CAROUSEL TRACK --- */
        main { 
            flex: 1; 
            position: relative;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        .carousel-track {
            display: flex;
            width: 300%;
            height: 100%;
            will-change: transform;
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .carousel-slide {
            width: 33.333%;
            height: 100%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* --- INPUT ZONES --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
        .field { display: flex; flex-direction: column; }
        
        .field-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 3px; margin-left: 2px;
            min-height: 18px; 
        }

        .field label {
            font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.8px; color: var(--ink-dim);
            line-height: 1;
        }

        /* COLOR-CODED LABELS */
        .label-wall {
            color: var(--color-wall) !important;
            font-weight: 900 !important;
        }

        .label-shim {
            color: var(--color-shim) !important;
            font-weight: 900 !important;
        }

        .field.wall-field:focus-within .input-zone {
            border-color: var(--color-wall);
        }

        .field.shim-field:focus-within .input-zone {
            border-color: var(--color-shim);
        }

        .formula-hint {
            font-size: 0.55rem; font-weight: 600; color: var(--ink-dim);
            opacity: 0.8; font-family: "SF Mono", monospace; text-transform: none;
            letter-spacing: 0px;
        }

        .micro-btn {
            background: var(--surface); 
            border: 1px solid var(--border);
            border-radius: var(--radius); padding: 3px 6px;
            font-size: 0.58rem; font-weight: 800;
            color: var(--ink-dim); cursor: pointer; letter-spacing: 0.5px;
            box-shadow: var(--bevel-out);
            display: flex; align-items: center;
        }
        .micro-btn:active { background: var(--input-bg); box-shadow: var(--bevel-in); }
        .micro-btn.toggle-on {
            background: var(--input-bg); color: var(--accent);
            box-shadow: var(--bevel-deep); border-color: var(--border);
        }

        .led-dot {
            display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            background: var(--ink-dim); margin-right: 5px;
            box-shadow: inset 0 1px 1px rgba(0,0,0,0.5);
        }
        .toggle-on .led-dot {
            background: var(--led-green);
            box-shadow: 0 0 4px var(--led-green);
        }

        .input-zone {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 5px 10px;
            display: flex; align-items: baseline;
            box-shadow: var(--bevel-in);
        }

        .field:focus-within .input-zone {
            background: var(--input-focus-bg);
            border-color: var(--accent);
            box-shadow: var(--bevel-deep);
        }
        .field:focus-within label { color: var(--ink); }

        input {
            background: none; border: none; width: 100%;
            font-size: 1.3rem; font-weight: 500; 
            font-family: "SF Mono", monospace;
            color: var(--ink); outline: none; padding: 0;
            -webkit-user-select: text; user-select: text;
            font-variant-numeric: tabular-nums;
        }

        ::selection { background: var(--accent); color: #ffffff; }
        body.dark-mode ::selection { background: var(--accent); color: #000000; }

        .unit { font-size: 0.65rem; font-weight: 800; color: var(--ink-dim); margin-left: 6px; }
        .field:focus-within .unit { color: var(--accent); }

        /* --- BOUNDARY PANEL --- */
        .boundary-panel {
            margin-top: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 12px;
            box-shadow: var(--bevel-out);
        }

        .boundary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
            margin-bottom: 6px;
        }

        .boundary-header label {
            font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1px; color: var(--ink);
        }

        .boundary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .boundary-col { display: flex; flex-direction: column; gap: 3px; }

        .boundary-title {
            font-size: 0.65rem; font-weight: 800; color: var(--accent);
            text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border); padding-bottom: 2px;
        }

        .boundary-row { display: flex; justify-content: space-between; align-items: center; }

        .boundary-row span {
            font-size: 0.58rem; font-weight: 800; color: var(--ink-dim);
            text-transform: uppercase;
        }

        .boundary-row div {
            font-family: "SF Mono", monospace; font-size: 0.85rem; 
            font-weight: 600; color: var(--ink);
        }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay); 
            z-index: 999; display: none; opacity: 0; transition: opacity 0.2s ease;
        }
        
        .bottom-sheet {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%);
            width: 100%; max-width: 440px;
            background: var(--chassis); 
            border-top: 1px solid var(--border);
            border-radius: 8px 8px 0 0;
            padding: 20px 20px 30px 20px; 
            transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1); 
        }
        
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .sheet-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink); }
        .close-btn { background: transparent; border: none; font-size: 1.5rem; color: var(--ink-dim); cursor: pointer; padding: 0; line-height: 1; }
        
        .table-wrap {
            width: 100%; overflow-x: auto; border: 1px solid var(--border); 
            box-shadow: var(--bevel-in); background: var(--input-bg); border-radius: var(--radius);
        }

        .ref-table { width: 100%; border-collapse: collapse; }
        .ref-table th, .ref-table td { padding: 10px 6px; text-align: center; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
        .ref-table th { font-size: 0.65rem; color: var(--ink-dim); text-transform: uppercase; font-weight: 800; background: var(--surface); }
        .ref-table td:first-child, .ref-table th:first-child { text-align: left; }
        .ref-table td:first-child { font-weight: 800; font-size: 0.7rem; color: var(--ink); text-transform: uppercase; background: var(--surface); }
        
        .val-cell { font-family: "SF Mono", monospace; font-size: 0.95rem; font-weight: 500; cursor: pointer; }
        .val-cell:active { background: var(--accent); color: var(--display-ink); }

        .edit-input {
            width: 100%; min-width: 40px;
            background: var(--input-bg); border: 1px solid var(--border);
            color: var(--ink); font-family: "SF Mono", monospace;
            font-size: 0.8rem; text-align: center; padding: 4px;
            border-radius: var(--radius); box-shadow: var(--bevel-in); outline: none;
        }
        .edit-input:focus { border-color: var(--accent); background: var(--input-focus-bg); }
        .edit-input.mat-input { text-align: left; font-family: "Inter", sans-serif; font-weight: 800; text-transform: uppercase; }
        
        .unlock-btn {
            background: transparent; border: 1px solid var(--border);
            color: var(--ink-dim); padding: 5px; border-radius: var(--radius); 
            cursor: pointer; margin-right: 12px; display: flex; align-items: center; justify-content: center;
        }
        .unlock-btn.active { background: var(--input-bg); color: var(--accent); box-shadow: var(--bevel-deep); }

        .del-btn { background: transparent; border: none; color: var(--accent); font-size: 1.2rem; font-weight: bold; cursor: pointer; padding: 0 4px; }
        .add-btn {
            flex: 1; background: var(--surface); border: 1px dashed var(--ink-dim);
            color: var(--ink-dim); font-size: 0.65rem; font-weight: 800;
            padding: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            border-radius: var(--radius); text-align: center;
        }

        .log-view { display: none; }
        .log-view.active { display: block; }
        
        .log-item { 
            background: var(--surface); border: 1px solid var(--border); 
            padding: 10px 12px; margin-bottom: 6px; border-radius: var(--radius); 
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; 
            box-shadow: var(--bevel-out); 
        }
        .log-title { font-size: 0.72rem; font-weight: 800; color: var(--ink); text-transform: uppercase; }
        .log-date { font-size: 0.6rem; color: var(--ink-dim); font-family: "SF Mono", monospace; margin-top: 2px; }
        
        .log-textarea { 
            width: 100%; height: 160px; background: var(--input-bg); border: 1px solid var(--border); 
            color: var(--ink); font-family: "SF Mono", monospace; font-size: 0.72rem; padding: 10px; 
            border-radius: var(--radius); box-shadow: var(--bevel-in); outline: none; resize: none; margin-bottom: 10px; 
        }
        .log-title-input { 
            width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border); 
            color: var(--ink); font-size: 0.8rem; font-weight: 800; text-transform: uppercase; 
            padding: 6px 0; margin-bottom: 10px; outline: none; 
        }

        footer { 
            display: flex; justify-content: space-between; align-items: center; 
            border-top: 1px solid var(--border); padding-top: 8px; margin-top: 6px; flex-shrink: 0;
        }
        
        .footer-btn { 
            background: var(--surface); border: 1px solid var(--border); 
            padding: 7px 14px; font-size: 0.62rem; font-weight: 800; 
            text-transform: uppercase; letter-spacing: 1px; 
            color: var(--ink-dim); border-radius: var(--radius); cursor: pointer; 
            box-shadow: var(--bevel-out);
        }
        .footer-btn:active { background: var(--input-bg); box-shadow: var(--bevel-in); }

        .copyright {
            text-align: center;
            margin-top: 4px;
            font-size: 0.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--ink-dim);
            opacity: 0.7;
            flex-shrink: 0;
        }
        
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="light-mode">

    <div class="app-container">
        <!-- MAIN DISPLAY (OLED BLACK WITH SVG VECTOR READOUT) -->
        <div class="sticky-readout">
            <div class="readout-content">
                <div class="readout-header">
                    <span class="readout-label" id="ctxLabel">Required Exposure</span>
                    <button id="logBtn" class="log-btn" onclick="logCurrent()">+ LOG</button>
                </div>
                
                <!-- SVG TIME DISPLAY -->
                <div class="svg-time-container">
                    <svg viewBox="0 0 280 64" preserveAspectRatio="xMinYMid meet">
                        <text x="0" y="50" id="svgTime" class="svg-time-text">00:00</text>
                    </svg>
                </div>
                
                <!-- HIGH-VISIBILITY COLOR-CODED TELEMETRY STRIP -->
                <div class="telemetry-strip" id="telemetryBox">
                    <div class="telemetry-item" id="tel1">
                        <span class="calc-wall">0.500" × 2</span><span class="calc-math"> = </span><span class="calc-highlight">1.000"</span><span class="calc-unit">TOTAL MATERIAL</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- NAVIGATION -->
        <nav id="navTabs">
            <button class="nav-item active" onclick="switchTabByIndex(0)">Exposure</button>
            <button class="nav-item" onclick="switchTabByIndex(1)">Distance/Ci Adj</button>
            <button class="nav-item" onclick="switchTabByIndex(2)">Density Adj</button>
        </nav>

        <!-- FLUID SWIPE CAROUSEL TRACK -->
        <main id="carouselViewport">
            <div class="carousel-track" id="carouselTrack">
                
                <!-- SLIDE 0: EXPOSURE -->
                <div class="carousel-slide">
                    <div class="grid">
                        <div class="field">
                            <div class="field-header">
                                <label>Film Factor</label>
                                <button class="micro-btn" onclick="openModal('chartOverlay')">TABLE</button>
                            </div>
                            <div class="input-zone">
                                <input type="text" inputmode="decimal" pattern="[0-9\.]*" id="targetExp" value="5.0">
                                <span class="unit">FF</span>
                            </div>
                        </div>
                        <div class="field">
                            <div class="field-header"><label>Source Activity</label></div>
                            <div class="input-zone">
                                <input type="text" inputmode="decimal" pattern="[0-9\.]*" id="curies" value="15">
                                <span class="unit">Ci</span>
                            </div>
                        </div>
                        
                        <div class="field wall-field">
                            <div class="field-header">
                                <label class="label-wall">Wall</label>
                                <button id="dwToggleBtn" class="micro-btn toggle-on" onclick="toggleDW()">
                                    <span class="led-dot"></span>DOUBLE WALL
                                </button>
                            </div>
                            <div class="input-zone">
                                <input type="text" inputmode="decimal" pattern="[0-9\.]*" id="pipeThick" value="0.500">
                                <span class="unit">In</span>
                            </div>
                        </div>
                        <div class="field shim-field">
                            <div class="field-header"><label class="label-shim">Shim</label></div>
                            <div class="input-zone">
                                <input type="text" inputmode="decimal" pattern="[0-9\.]*" id="shimThick" value="0.000">
                                <span class="unit">In</span>
                            </div>
                        </div>

                        <div class="field">
                            <div class="field-header"><label>Distance (SFD)</label></div>
                            <div class="input-zone">
                                <input type="text" inputmode="decimal" pattern="[0-9\.]*" id="sfd" value="15">
                                <span class="unit">In</span>
                            </div>
                        </div>
                        <div class="field">
                            <div class="field-header">
                                <label>Gap (Air)</label>
                                <span class="formula-hint">(t+g)/t</span>
                            </div>
                            <div class="input-zone">
                                <input type="text" inputmode="decimal" pattern="[0-9\.]*" id="gapThick" value="0.0">
                                <span class="unit">In</span>
                            </div>
                        </div>
                    </div>

                    <!-- RADIATION BOUNDARY PANEL -->
                    <div class="boundary-panel">
                        <div class="boundary-header">
                            <label>Collimator Ratio</label>
                            <div class="input-zone" style="width: 95px; padding: 3px 8px;">
                                <input type="text" inputmode="decimal" pattern="[0-9\.]*" id="collimator" value="16" style="font-size: 1.1rem;">
                                <span class="unit">:1</span>
                            </div>
                        </div>
                        <div class="boundary-grid">
                            <div class="boundary-col">
                                <div class="boundary-title">100 mR/hr</div>
                                <div class="boundary-row"><span>UNSHIELDED</span><div id="unshielded100">0.0 FT</div></div>
                                <div class="boundary-row"><span>SHIELDED</span><div id="shielded100">0.0 FT</div></div>
                            </div>
                            <div class="boundary-col">
                                <div class="boundary-title">2 mR/hr</div>
                                <div class="boundary-row"><span>UNSHIELDED</span><div id="unshielded2">0.0 FT</div></div>
                                <div class="boundary-row"><span>SHIELDED</span><div id="shielded2">0.0 FT</div></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SLIDE 1: ADJUSTMENT -->
                <div class="carousel-slide">
                    <div class="grid">
                        <div class="field" style="grid-column: span 2;">
                            <div class="field-header"><label>Original Time</label></div>
                            <div class="input-zone"><input type="text" id="t1" value="01:00"><span class="unit">MM:SS</span></div>
                        </div>
                        <div class="field"><div class="field-header"><label>Old SFD</label></div><div class="input-zone"><input type="text" inputmode="decimal" pattern="[0-9\.]*" id="d1" value="12"></div></div>
                        <div class="field"><div class="field-header"><label>New SFD</label></div><div class="input-zone"><input type="text" inputmode="decimal" pattern="[0-9\.]*" id="d2" value="24"></div></div>
                        <div class="field"><div class="field-header"><label>Old Ci</label></div><div class="input-zone"><input type="text" inputmode="decimal" pattern="[0-9\.]*" id="c1" value="100"></div></div>
                        <div class="field"><div class="field-header"><label>New Ci</label></div><div class="input-zone"><input type="text" inputmode="decimal" pattern="[0-9\.]*" id="c2" value="100"></div></div>
                    </div>
                </div>

                <!-- SLIDE 2: DENSITY -->
                <div class="carousel-slide">
                    <div class="grid">
                        <div class="field" style="grid-column: span 2;">
                            <div class="field-header"><label>Original Time</label></div>
                            <div class="input-zone"><input type="text" id="dt1" value="01:00"><span class="unit">MM:SS</span></div>
                        </div>
                        <div class="field"><div class="field-header"><label>Current Density</label></div><div class="input-zone"><input type="text" inputmode="decimal" pattern="[0-9\.]*" id="dens1" value="2.0"></div></div>
                        <div class="field"><div class="field-header"><label>Target Density</label></div><div class="input-zone"><input type="text" inputmode="decimal" pattern="[0-9\.]*" id="dens2" value="3.0"></div></div>
                    </div>
                </div>

            </div>
        </main>

        <footer>
            <button class="footer-btn" onclick="shareApp()">SHARE</button>
            <button class="footer-btn" onclick="openModal('logOverlay')">LOGS</button>
            <button class="footer-btn" onclick="toggleTheme()">MODE</button>
        </footer>
        
        <div class="copyright">© 2026 Marco Ariza. / RT-321. All rights reserved.</div>
    </div>

    <!-- TARGET EXPOSURE CHART OVERLAY -->
    <div id="chartOverlay" class="modal-overlay" onclick="closeModal('chartOverlay', event)">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <div class="sheet-title">Exposure Matrix</div>
                <div style="display:flex; align-items:center;">
                    <button id="chartEditBtn" class="unlock-btn" onclick="toggleChartEdit()">
                        <svg id="iconLock" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </button>
                    <button class="close-btn" onclick="closeModal('chartOverlay', event)">×</button>
                </div>
            </div>
            <div class="table-wrap">
                <table class="ref-table">
                    <thead id="chartHead"></thead>
                    <tbody id="chartBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- LOGBOOK OVERLAY -->
    <div id="logOverlay" class="modal-overlay" onclick="closeModal('logOverlay', event)">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            
            <!-- LIST VIEW -->
            <div id="logListView" class="log-view active">
                <div class="sheet-header">
                    <div class="sheet-title">Job Folders</div>
                    <button class="close-btn" onclick="closeModal('logOverlay', event)">×</button>
                </div>
                <div style="display:flex; gap:8px; margin-bottom: 12px;">
                    <button class="add-btn" onclick="createNewLog()">+ NEW JOB FOLDER</button>
                    <button class="add-btn" onclick="exportLogs()">↓ EXPORT ALL</button>
                </div>
                <div id="logList"></div>
            </div>

            <!-- DETAIL VIEW -->
            <div id="logDetailView" class="log-view">
                <div class="sheet-header">
                    <button class="micro-btn" onclick="closeLogDetail()">← BACK</button>
                    <div class="sheet-title">Job Details</div>
                    <button class="close-btn" onclick="closeModal('logOverlay', event)">×</button>
                </div>
                <input type="text" id="logTitleInput" class="log-title-input" placeholder="Job Name..." oninput="saveActiveLog()">
                <textarea id="logTextarea" class="log-textarea" placeholder="Tap [+ LOG] on the main screen to save a calculation here..." oninput="saveActiveLog()"></textarea>
                <div style="display:flex; gap:8px; margin-top:10px;">
                    <button class="add-btn" onclick="copyActiveLog()">COPY ALL</button>
                    <button class="add-btn" style="border-color:var(--accent); color:var(--accent);" onclick="deleteActiveLog()">DELETE JOB</button>
                </div>
            </div>

        </div>

    <!-- PWA SERVICE WORKER REGISTRATION -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('ServiceWorker registration successful');
                }, err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>

    <script>
        const GAMMA = 5.2; 
        const STEEL_MU = 1.53; 
        const MAT_CONSTANT = 0.0469; 

        const tabIds = ['exposure', 'adjustment', 'density'];
        let currentTabIndex = 0;
        let currentTab = 'exposure';
        let isDoubleWall = true; 
        let lastGap = 0; 

        const INPUT_IDS =['targetExp', 'curies', 'pipeThick', 'shimThick', 'sfd', 'gapThick', 'collimator', 't1', 'd1', 'd2', 'c1', 'c2', 'dt1', 'dens1', 'dens2'];

        function saveState() {
            const state = { isDoubleWall: isDoubleWall };
            INPUT_IDS.forEach(id => { 
                const el = document.getElementById(id);
                if(el) state[id] = el.value; 
            });
            localStorage.setItem('gammaCalcState', JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem('gammaCalcState');
            if (saved) {
                const state = JSON.parse(saved);
                INPUT_IDS.forEach(id => {
                    const el = document.getElementById(id);
                    if (el && state[id] !== undefined) el.value = state[id];
                });
                if (state.isDoubleWall !== undefined) {
                    isDoubleWall = state.isDoubleWall;
                    const btn = document.getElementById('dwToggleBtn');
                    if(btn) {
                        if (isDoubleWall) btn.classList.add('toggle-on');
                        else btn.classList.remove('toggle-on');
                    }
                }
            }
            if(localStorage.getItem('gammaTheme') === 'dark') document.body.classList.add('dark-mode');
            lastGap = parseFloat(document.getElementById('gapThick').value) || 0;
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('gammaTheme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }

        function openModal(id) {
            if(id === 'chartOverlay') renderChart();
            if(id === 'logOverlay') {
                document.getElementById('logDetailView').classList.remove('active');
                document.getElementById('logListView').classList.add('active');
                renderLogList();
            }
            const overlay = document.getElementById(id);
            overlay.style.display = 'block';
            void overlay.offsetWidth;
            overlay.style.opacity = '1';
            overlay.querySelector('.bottom-sheet').style.transform = 'translateX(-50%) translateY(0)';
        }

        function closeModal(id, e) {
            if (e) e.stopPropagation();
            if(id === 'chartOverlay' && isChartEditMode) toggleChartEdit(); 
            
            const overlay = document.getElementById(id);
            overlay.style.opacity = '0';
            overlay.querySelector('.bottom-sheet').style.transform = 'translateX(-50%) translateY(100%)';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
        }

        let logs = JSON.parse(localStorage.getItem('gammaLogs')) ||[];
        let activeLogId = null;

        function renderLogList() {
            const list = document.getElementById('logList');
            list.innerHTML = '';
            if(logs.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:15px; color:var(--ink-dim); font-size:0.65rem; text-transform:uppercase; letter-spacing:1px;">No jobs found</div>';
                return;
            }
            logs.forEach(log => {
                const div = document.createElement('div');
                div.className = 'log-item';
                div.onclick = () => openLogDetail(log.id);
                div.innerHTML = `<div><div class="log-title">${log.title}</div><div class="log-date">${log.date}</div></div><div style="color:var(--accent); font-weight:bold;">›</div>`;
                list.appendChild(div);
            });
        }

        function createNewLog() {
            const id = Date.now().toString();
            const dateStr = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const newLog = { id: id, title: `JOB - ${dateStr}`, date: dateStr, content: "" };
            logs.unshift(newLog);
            saveLogs();
            openLogDetail(id);
        }

        function exportLogs() {
            if (logs.length === 0) { alert("No logs to export."); return; }
            let exportText = "GAMMA EXPOSURE LOGS\n====================\n\n";
            logs.forEach(log => {
                exportText += `--- ${log.title} (${log.date}) ---\n${log.content}\n\n`;
            });
            const blob = new Blob([exportText], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `Gamma_Logs_${new Date().toISOString().split('T')[0]}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function openLogDetail(id) {
            activeLogId = id;
            const log = logs.find(l => l.id === id);
            document.getElementById('logTitleInput').value = log.title;
            document.getElementById('logTextarea').value = log.content;
            document.getElementById('logListView').classList.remove('active');
            document.getElementById('logDetailView').classList.add('active');
        }

        function closeLogDetail() {
            activeLogId = null;
            document.getElementById('logDetailView').classList.remove('active');
            document.getElementById('logListView').classList.add('active');
            renderLogList();
        }

        function saveActiveLog() {
            if(!activeLogId) return;
            const log = logs.find(l => l.id === activeLogId);
            if(log) {
                log.title = document.getElementById('logTitleInput').value;
                log.content = document.getElementById('logTextarea').value;
                saveLogs();
            }
        }

        function saveLogs() { localStorage.setItem('gammaLogs', JSON.stringify(logs)); }

        function deleteActiveLog() {
            if(confirm("Delete this job folder?")) {
                logs = logs.filter(l => l.id !== activeLogId);
                saveLogs();
                closeLogDetail();
            }
        }

        function copyActiveLog() {
            const text = document.getElementById('logTextarea').value;
            navigator.clipboard.writeText(text);
            alert("Job log copied to clipboard!");
        }

        function logCurrent() {
            if(logs.length === 0) {
                const id = Date.now().toString();
                const dateStr = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                logs.unshift({ id: id, title: `JOB - ${dateStr}`, date: dateStr, content: "" });
            }
            const targetLog = logs[0];
            const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            let entry = "";
            const svgTimeEl = document.getElementById("svgTime");
            const timeRes = svgTimeEl ? svgTimeEl.textContent : "00:00";

            if (currentTab === 'exposure') {
                const exp = document.getElementById('targetExp').value;
                const cur = document.getElementById('curies').value;
                const pipeVal = parseFloat(document.getElementById('pipeThick').value) || 0;
                const shimVal = parseFloat(document.getElementById('shimThick').value) || 0;
                const modeStr = isDoubleWall ? `DW (${pipeVal.toFixed(3)}"x2)` : `SW (${pipeVal.toFixed(3)}")`;
                const shimStr = shimVal > 0 ? ` + ${shimVal.toFixed(3)}" Shim` : "";
                const sfd = document.getElementById('sfd').value;
                const gap = parseFloat(document.getElementById('gapThick').value) || 0;
                const gapStr = gap > 0 ? ` + ${gap}" Gap` : "";
                entry = `[${now}] EXPOSURE\nFF: ${exp} | Src: ${cur}Ci\nStack: ${modeStr}${shimStr}${gapStr}\nSFD: ${sfd}"\n>> TIME: ${timeRes}\n`;
            } else if (currentTab === 'adjustment') {
                const t1 = document.getElementById('t1').value;
                const d1 = document.getElementById('d1').value;
                const d2 = document.getElementById('d2').value;
                const c1 = document.getElementById('c1').value;
                const c2 = document.getElementById('c2').value;
                entry = `[${now}] DISTANCE/CI ADJ\nOrig: ${t1}m | SFD: ${d1}"->${d2}" | Ci: ${c1}->${c2}\n>> TIME: ${timeRes}\n`;
            } else if (currentTab === 'density') {
                const dt1 = document.getElementById('dt1').value;
                const dens1 = document.getElementById('dens1').value;
                const dens2 = document.getElementById('dens2').value;
                entry = `[${now}] DENSITY ADJ\nOrig: ${dt1}m | Dens: ${dens1}->${dens2}\n>> TIME: ${timeRes}\n`;
            }

            targetLog.content = entry + "\n" + targetLog.content;
            saveLogs();
            if(activeLogId === targetLog.id) document.getElementById('logTextarea').value = targetLog.content;
            
            const btn = document.getElementById('logBtn');
            const originalText = btn.innerText;
            btn.innerText = "SAVED!";
            btn.style.background = "var(--accent)";
            btn.style.color = "var(--display-bg)";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "transparent";
                btn.style.color = "var(--accent)";
            }, 1000);
        }

        const DEFAULT_CHART = {
            cols:["Fuji 100", "Fuji 80", "Fuji 50"],
            rows:[
                { mat: "Steel", vals:[2.8, 3.8, 5.0] },
                { mat: "Inconel", vals:[3.5, 4.8, 6.0] },
                { mat: "CuNi", vals:[4.0, 5.2, 6.5] }
            ]
        };

        const SVG_LOCK = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`;
        const SVG_UNLOCK = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>`;

        let chartData = JSON.parse(localStorage.getItem('gammaChartData')) || DEFAULT_CHART;
        let isChartEditMode = false;

        function syncChartDataFromDOM() {
            if(!isChartEditMode) return;
            chartData.cols.forEach((col, i) => {
                const el = document.getElementById(`col_${i}`);
                if(el) chartData.cols[i] = el.value;
            });
            chartData.rows.forEach((row, r) => {
                const elMat = document.getElementById(`mat_${r}`);
                if(elMat) chartData.rows[r].mat = elMat.value;
                row.vals.forEach((val, c) => {
                    const elVal = document.getElementById(`val_${r}_${c}`);
                    if(elVal) chartData.rows[r].vals[c] = parseFloat(elVal.value) || 0;
                });
            });
        }

        function renderChart() {
            const thead = document.getElementById('chartHead');
            const tbody = document.getElementById('chartBody');
            
            let headHtml = `<tr><th>Material</th>`;
            chartData.cols.forEach((col, i) => {
                if(isChartEditMode) {
                    headHtml += `<th><div style="display:flex; align-items:center; gap:2px;"><input type="text" class="edit-input" id="col_${i}" value="${col}"><button class="del-btn" onclick="delCol(${i})">×</button></div></th>`;
                } else {
                    headHtml += `<th>${col}</th>`;
                }
            });
            if(isChartEditMode) headHtml += `<th><button class="add-btn" onclick="addCol()">+ COL</button></th>`;
            headHtml += `</tr>`;
            thead.innerHTML = headHtml;

            let bodyHtml = '';
            chartData.rows.forEach((row, r) => {
                bodyHtml += `<tr>`;
                if(isChartEditMode) {
                    bodyHtml += `<td><div style="display:flex; align-items:center; gap:2px;"><button class="del-btn" onclick="delRow(${r})">×</button><input type="text" class="edit-input mat-input" id="mat_${r}" value="${row.mat}"></div></td>`;
                    row.vals.forEach((val, c) => {
                        bodyHtml += `<td><input type="text" inputmode="decimal" pattern="[0-9\.]*" class="edit-input" id="val_${r}_${c}" value="${val}"></td>`;
                    });
                    bodyHtml += `<td></td>`; 
                } else {
                    bodyHtml += `<td>${row.mat}</td>`;
                    row.vals.forEach((val) => {
                        bodyHtml += `<td class="val-cell" onclick="setTargetValue(${val})">${val}</td>`;
                    });
                }
                bodyHtml += `</tr>`;
            });

            if(isChartEditMode) {
                bodyHtml += `<tr><td colspan="${chartData.cols.length + 2}"><button class="add-btn" style="margin-top:6px;" onclick="addRow()">+ ADD ROW</button></td></tr>`;
            }
            tbody.innerHTML = bodyHtml;
        }

        function toggleChartEdit() {
            const btn = document.getElementById('chartEditBtn');
            if(isChartEditMode) {
                syncChartDataFromDOM();
                localStorage.setItem('gammaChartData', JSON.stringify(chartData));
                btn.classList.remove('active');
                btn.innerHTML = SVG_LOCK;
            } else {
                btn.classList.add('active');
                btn.innerHTML = SVG_UNLOCK;
            }
            isChartEditMode = !isChartEditMode;
            renderChart();
        }

        function addCol() { syncChartDataFromDOM(); chartData.cols.push("New"); chartData.rows.forEach(r => r.vals.push(0)); renderChart(); }
        function addRow() { syncChartDataFromDOM(); chartData.rows.push({ mat: "New", vals: new Array(chartData.cols.length).fill(0) }); renderChart(); }
        function delCol(c) { if(chartData.cols.length <= 1) return; syncChartDataFromDOM(); chartData.cols.splice(c, 1); chartData.rows.forEach(r => r.vals.splice(c, 1)); renderChart(); }
        function delRow(r) { if(chartData.rows.length <= 1) return; syncChartDataFromDOM(); chartData.rows.splice(r, 1); renderChart(); }

        function setTargetValue(val) {
            if(isChartEditMode) return; 
            document.getElementById('targetExp').value = val;
            saveState();
            closeModal('chartOverlay');
            runCalc();
        }

        function shareApp() {
            if (navigator.share) {
                navigator.share({ title: 'RT-321 Exposure Calculator', url: window.location.href }).catch(console.error);
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("App link copied to clipboard!");
            }
        }

        function toggleDW() {
            isDoubleWall = !isDoubleWall;
            const btn = document.getElementById('dwToggleBtn');
            if (isDoubleWall) btn.classList.add('toggle-on');
            else btn.classList.remove('toggle-on');
            saveState();
            runCalc();
        }

        function parseTimeToMinutes(valStr) {
            if (!valStr) return 0;
            valStr = valStr.trim();
            if (valStr.includes(':')) {
                const parts = valStr.split(':').map(p => parseFloat(p) || 0);
                if (parts.length === 3) {
                    return parts[0] * 60 + parts[1] + parts[2] / 60;
                } else if (parts.length === 2) {
                    return parts[0] + parts[1] / 60;
                }
            }
            return parseFloat(valStr) || 0;
        }

        document.getElementById('gapThick').addEventListener('input', function() {
            let newGap = parseFloat(this.value) || 0;
            let currentSfd = parseFloat(document.getElementById('sfd').value) || 0;
            let pipeRaw = parseFloat(document.getElementById('pipeThick').value) || 0;
            let shimVal = parseFloat(document.getElementById('shimThick').value) || 0;
            let thk = (isDoubleWall ? (pipeRaw * 2) : pipeRaw) + shimVal;
            
            if (thk > 0 && currentSfd > 0) {
                let baseSfd = currentSfd / ((thk + lastGap) / thk);
                let updatedSfd = baseSfd * ((thk + newGap) / thk);
                document.getElementById('sfd').value = Math.round(updatedSfd * 100) / 100;
            }
            lastGap = newGap;
            saveState();
            runCalc();
        });

        document.getElementById('sfd').addEventListener('input', function() {
            lastGap = parseFloat(document.getElementById('gapThick').value) || 0;
            saveState();
            runCalc();
        });

        function runCalc() {
            const tel1 = document.getElementById('tel1');

            if (currentTab === 'exposure') {
                const filmFactor = parseFloat(document.getElementById('targetExp').value) || 0;
                const currentAct = parseFloat(document.getElementById('curies').value) || 0;
                const pipeRaw = parseFloat(document.getElementById('pipeThick').value) || 0;
                const shimVal = parseFloat(document.getElementById('shimThick').value) || 0;
                const wallTotal = isDoubleWall ? (pipeRaw * 2) : pipeRaw;
                const thk = wallTotal + shimVal;
                const sfd = parseFloat(document.getElementById('sfd').value) || 0;

                if (filmFactor && currentAct && sfd) {
                    const exposureFactor = filmFactor * MAT_CONSTANT * Math.exp(STEEL_MU * thk);
                    const timeInMinutes = (exposureFactor * Math.pow(sfd, 2)) / currentAct;
                    
                    formatDisplay(timeInMinutes);

                    let wallHtml = "";
                    if (isDoubleWall) {
                        wallHtml = `<span class="calc-wall">${pipeRaw.toFixed(3)}" × 2</span>`;
                    } else {
                        wallHtml = `<span class="calc-wall">${pipeRaw.toFixed(3)}"</span>`;
                    }

                    let shimHtml = "";
                    if (shimVal > 0) {
                        shimHtml = `<span class="calc-math"> + </span><span class="calc-shim">${shimVal.toFixed(3)}"</span>`;
                    }

                    tel1.innerHTML = `${wallHtml}${shimHtml}<span class="calc-math"> = </span><span class="calc-highlight">${thk.toFixed(3)}"</span><span class="calc-unit">TOTAL MATERIAL</span>`;
                    tel1.style.display = 'block';
                } else {
                    formatDisplay(0);
                    tel1.innerHTML = `<span class="calc-math">---</span>`;
                }

                let colInput = document.getElementById('collimator');
                let colRatio = colInput ? parseFloat(colInput.value) : 16;
                if (!colRatio || colRatio <= 0) colRatio = 1; 

                if (currentAct > 0) {
                    const i0 = currentAct * 5200; 
                    const id = i0 / colRatio;     

                    document.getElementById('unshielded100').innerText = Math.sqrt(i0 / 100).toFixed(1) + " FT";
                    document.getElementById('unshielded2').innerText = Math.sqrt(i0 / 2).toFixed(1) + " FT";
                    document.getElementById('shielded100').innerText = Math.sqrt(id / 100).toFixed(1) + " FT";
                    document.getElementById('shielded2').innerText = Math.sqrt(id / 2).toFixed(1) + " FT";
                } else {
                    document.getElementById('unshielded100').innerText = "0.0 FT";
                    document.getElementById('unshielded2').innerText = "0.0 FT";
                    document.getElementById('shielded100').innerText = "0.0 FT";
                    document.getElementById('shielded2').innerText = "0.0 FT";
                }

            } else if (currentTab === 'adjustment') {
                const t1 = parseTimeToMinutes(document.getElementById('t1').value);
                const d1 = parseFloat(document.getElementById('d1').value) || 0;
                const d2 = parseFloat(document.getElementById('d2').value) || 0;
                const c1 = parseFloat(document.getElementById('c1').value) || 0;
                const c2 = parseFloat(document.getElementById('c2').value) || 0;
                if (t1 && d1 && d2 && c1 && c2) {
                    const ratio = Math.pow(d2 / d1, 2) * (c1 / c2);
                    formatDisplay(t1 * ratio);
                    tel1.innerHTML = `<span class="calc-math">FACTOR </span><span class="calc-highlight">${ratio.toFixed(2)}x</span>`;
                } else {
                    formatDisplay(0);
                    tel1.innerHTML = `<span class="calc-math">FACTOR ---</span>`;
                }
            } else if (currentTab === 'density') {
                const t1 = parseTimeToMinutes(document.getElementById('dt1').value);
                const d1 = parseFloat(document.getElementById('dens1').value) || 0;
                const d2 = parseFloat(document.getElementById('dens2').value) || 0;
                if (t1 && d1 && d2) {
                    formatDisplay(t1 * (d2 / d1));
                    const shift = d2 - d1;
                    const sign = shift > 0 ? '+' : '';
                    tel1.innerHTML = `<span class="calc-math">SHIFT </span><span class="calc-highlight">${sign}${shift.toFixed(2)}</span><span class="calc-unit">ΔD</span>`;
                } else {
                    formatDisplay(0);
                    tel1.innerHTML = `<span class="calc-math">SHIFT ---</span>`;
                }
            }
        }

        function formatDisplay(mins) {
            const svgText = document.getElementById("svgTime");
            if (!mins || mins <= 0 || !isFinite(mins) || isNaN(mins)) {
                if (svgText) svgText.textContent = "00:00";
                return;
            }
            let h = Math.floor(mins / 60);
            let m = Math.floor(mins % 60);
            let s = Math.round((mins * 60) % 60);
            if (s >= 60) { s = 0; m++; }
            if (m >= 60) { m = 0; h++; }

            const hh = h.toString().padStart(2, '0');
            const mm = m.toString().padStart(2, '0');
            const ss = s.toString().padStart(2, '0');
            
            if (svgText) {
                svgText.textContent = h > 0 ? `${hh}:${mm}:${ss}` : `${mm}:${ss}`;
            }
        }

        // --- FLUID CAROUSEL & TOUCH GESTURE ENGINE ---
        const track = document.getElementById('carouselTrack');
        const navButtons = document.querySelectorAll('#navTabs .nav-item');

        function switchTabByIndex(index) {
            if (index < 0 || index >= tabIds.length) return;
            currentTabIndex = index;
            currentTab = tabIds[index];

            track.style.transform = `translateX(-${index * 33.333}%)`;

            navButtons.forEach((btn, idx) => {
                if (idx === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            const labels = {'exposure': 'Required Exposure', 'adjustment': 'Distance/Ci Adjusted', 'density': 'Density Adjusted'};
            document.getElementById('ctxLabel').innerText = labels[currentTab];

            const svgText = document.getElementById('svgTime');
            if (svgText) {
                svgText.classList.add('pulse');
                setTimeout(() => svgText.classList.remove('pulse'), 200);
            }

            runCalc();
        }

        let startX = 0;
        let isDragging = false;
        const viewport = document.getElementById('carouselViewport');

        viewport.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            track.style.transition = 'none'; 
        }, {passive: true});

        viewport.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const currentX = e.touches[0].clientX;
            const diff = currentX - startX;
            const movePercentage = (diff / viewport.offsetWidth) * 33.333;
            const targetTranslate = -(currentTabIndex * 33.333) + movePercentage;
            
            if ((currentTabIndex === 0 && targetTranslate > 0) || (currentTabIndex === tabIds.length - 1 && targetTranslate < -((tabIds.length - 1) * 33.333))) {
                track.style.transform = `translateX(${targetTranslate * 0.4}%)`;
            } else {
                track.style.transform = `translateX(${targetTranslate}%)`;
            }
        }, {passive: true});

        viewport.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            track.style.transition = 'transform 0.25s cubic-bezier(0.25, 1, 0.5, 1)'; 

            const endX = e.changedTouches[0].clientX;
            const diff = endX - startX;

            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentTabIndex > 0) {
                    switchTabByIndex(currentTabIndex - 1);
                } else if (diff < 0 && currentTabIndex < tabIds.length - 1) {
                    switchTabByIndex(currentTabIndex + 1);
                } else {
                    switchTabByIndex(currentTabIndex); 
                }
            } else {
                switchTabByIndex(currentTabIndex); 
            }
        }, {passive: true});

        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('focus', function() {
                setTimeout(() => { this.select(); this.setSelectionRange(0, 9999); }, 10);
            });
            inp.addEventListener('click', function() { this.select(); this.setSelectionRange(0, 9999); });
            inp.addEventListener('mouseup', (e) => { e.preventDefault(); });
        });

        document.addEventListener('input', (e) => {
            if (e.target.tagName === 'INPUT' && !e.target.classList.contains('edit-input') && e.target.id !== 'gapThick') {
                saveState();
                runCalc();
            }
        });

        window.onload = () => {
            loadState();
            renderChart();
            runCalc();
        };
    </script>
</body>
</html>
